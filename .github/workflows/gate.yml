name: DIERP Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  hermetic-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ontology/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt rdflib pyshacl owlrl pyyaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install ontology dependencies
        working-directory: ontology
        run: npm ci

      - name: Run aggregated gate
        run: python backend/scripts/gate.py

  browser-e2e:
    runs-on: windows-latest
    needs: hermetic-gate
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hserp_mvp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hserp_mvp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hserp_mvp
      SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install chromium

      - name: Migrate and seed demo data
        working-directory: backend
        run: |
          $env:PYTHONPATH = ".."
          python -m alembic upgrade head
          python scripts/reset_demo.py --by ci

      - name: Start backend
        run: |
          $env:PYTHONPATH = ".."
          Start-Process python -ArgumentList "-m uvicorn api.main:app --host 127.0.0.1 --port 8000" -WorkingDirectory backend -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/health
              if ($r.StatusCode -eq 200) { Write-Host "backend ready"; break }
            } catch { Start-Sleep -Seconds 1 }
          }

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          Start-Process npm.cmd -ArgumentList "run dev -- --port 3010 --host 127.0.0.1" -PassThru
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3010/
              if ($r.StatusCode -eq 200) { Write-Host "frontend ready"; break }
            } catch { Start-Sleep -Seconds 1 }
          }

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3010
        run: npx playwright test
