# Alembic config (N4 baseline). Keep comments ASCII-only:
# configparser reads this file with locale encoding on Windows.
# Usage: cd backend && python -m alembic current / upgrade head / revision --autogenerate -m "..."
[alembic]
script_location = migrations
prepend_sys_path = .
# URL is injected by migrations/env.py from backend.common.database.base
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
