services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # 生产必须覆盖；占位值仅用于本地启动演示
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:123456@db:5432/hserp_mvp}
      ERP_CORS_ORIGINS: ${ERP_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: hserp_mvp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hserp_mvp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
